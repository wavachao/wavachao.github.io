title: Wu Huachao
description: Computer vision researcher and software engineer working across visual learning, Go backend development, modern C++, and Linux systems.
url: https://wavachao.github.io
baseurl: ""
lang: en
timezone: Asia/Shanghai

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax
  toc_levels: 2..4
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: /blog/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav: blog

exclude:
  - README.md
  - content
  - scripts
  - vendor
  - Gemfile
  - Gemfile.lock
