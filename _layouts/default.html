<!doctype html>
<html lang="{{ page.lang | default: site.lang }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1eee6" data-theme-color>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="author" content="{{ site.data.profile.name }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ page.title | escape }} — {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=hc-20260726">
  <link rel="icon" type="image/png" sizes="200x200" href="/favicon.png?v=hc-20260726">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=hc-20260726">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("site-theme");
        var preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = saved || preferred;
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    }());
  </script>
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body class="{{ page.body_class }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include site-header.html %}

  <main id="main-content">
    {{ content }}
  </main>

  {% include site-footer.html %}
  <script src="/assets/js/site.js" defer></script>
</body>
</html>
