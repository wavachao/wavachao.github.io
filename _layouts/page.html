---
layout: default
---
<article class="simple-page site-shell">
  <header class="simple-page-header">
    {% if page.kicker %}<p class="page-kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
  <div class="article-body cjk-supported">
    {{ content }}
  </div>
</article>
