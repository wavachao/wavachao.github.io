<header class="site-header">
  <div class="site-shell header-inner">
    <a class="brand" href="/" aria-label="Wu Huachao — home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" focusable="false">
          <path d="M48.5 14.5A23.5 23.5 0 1 0 48.5 49.5"
                fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round"/>
          <text x="20" y="43"
                fill="currentColor"
                font-family="Newsreader, Georgia, 'Times New Roman', serif"
                font-size="31" font-style="italic" font-weight="500">H</text>
          <path class="brand-mark-accent" d="M49.5 13.5l5-4"
                fill="none" stroke-width="2.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-name">{{ site.data.profile.name }}</span>
    </a>

    <div class="header-actions">
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="/" {% if page.nav == "home" %}aria-current="page"{% endif %}>Home</a>
        <a href="/#work">Work</a>
        <a href="/blog/" {% if page.nav == "blog" %}aria-current="page"{% endif %}>Blog</a>
        <a href="/archives/" {% if page.nav == "archives" %}aria-current="page"{% endif %}>Archive</a>
        <a href="/about/" {% if page.nav == "about" %}aria-current="page"{% endif %}>About</a>
      </nav>

      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode">
        <span class="theme-glyph" aria-hidden="true">◐</span>
        <span class="theme-label">Theme</span>
      </button>
    </div>
  </div>
</header>
